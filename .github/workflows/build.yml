# This workflow builds SeedcrackerX and enforces the passive local-only policy.

name: Build

on:
  push:
    paths-ignore:
      - 'readmes/*'
      - '*.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: 25
        distribution: 'zulu'

    - name: Audit passive-only source policy
      run: python3 scripts/audit_passive_only.py

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      shell: bash
      run: |
        set -o pipefail
        ./gradlew build 2>&1 | tee build.log

    - name: Audit produced JAR
      shell: bash
      run: |
        JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-api.jar' | head -n 1)"
        test -n "$JAR"
        python3 scripts/audit_built_jar.py "$JAR"

    - name: Upload diagnostics
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostics
        path: |
          build.log
          build/reports/passive-jar-audit.txt
        if-no-files-found: ignore

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: success() && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
      with:
        name: build
        path: |
          build/libs/*
          build/reports/passive-jar-audit.txt

    - name: Remove *-dev.jar
      if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      run: rm ./build/libs/*-dev.jar || true

    - name: Remove *-api.jar
      if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      run: rm ./build/libs/*-api.jar || true

    - name: Create prerelease
      if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: prerelease
        prerelease: true
        title: Prerelease Build
        files: |
          ./build/libs/*.jar
          ./build/reports/passive-jar-audit.txt
