# This workflow builds SeedcrackerX and enforces the passive local-only policy.

name: Build

on:
  push:
    paths-ignore:
      - 'readmes/*'
      - '*.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: 25
        distribution: 'zulu'

    - name: Audit passive-only policy
      run: python3 scripts/audit_passive_only.py

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
      with:
        name: build
        path: build/libs/*

    - name: Remove *-dev.jar
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      run: rm ./build/libs/*-dev.jar || true

    - name: Remove *-api.jar
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      run: rm ./build/libs/*-api.jar || true

    - name: Create prerelease
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: prerelease
        prerelease: true
        title: Prerelease Build
        files: |
          ./build/libs/*.jar
